# hako shop Worker: Founder Edition checkout, units-left counter, founder numbers.
# Deploy: see README.md in this folder.
name = "hako-shop"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# The Stripe price of the Founder Edition product (price_...). Not a secret.
STRIPE_PRICE_ID = "price_1UNDXnLMHRqh1JEk0ziMrJ5H"
FOUNDER_TOTAL = "25"
# "true" when pre-orders open. Until then /checkout refuses.
PREORDERS_OPEN = "false"
SITE_URL = "https://www.hakoshop.com"
ALLOWED_ORIGINS = "https://www.hakoshop.com,https://hakoshop.com"
# Shipping in US cents by destination; "*" is everywhere else.
# Estimates for one boxed unit (~2.5 kg / 6 lb, ~30x30x15 cm) from Texas at
# discounted USPS rates (Ground Advantage in the US, Priority Mail International
# abroad, both tracked and insured). Replace with real quotes once a packed unit
# is weighed.
SHIPPING_CENTS = '{"US": 1500, "CA": 4500, "MX": 4500, "*": 6900}'

# Secrets (never in this file): set with
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET

[[durable_objects.bindings]]
name = "FOUNDERS"
class_name = "Founders"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Founders"]

# ---------------------------------------------------------------------------
# Test shop: Stripe test mode, its own counter, always open. Deployed as
# "hako-shop-test" by the workflow when the STRIPE_TEST_* secrets exist.
# Open it with https://www.hakoshop.com/?shop=test
# ---------------------------------------------------------------------------
[env.test]
name = "hako-shop-test"

[env.test.vars]
STRIPE_PRICE_ID = "price_REPLACE_ME"   # overridden by the STRIPE_TEST_PRICE_ID repo variable
FOUNDER_TOTAL = "25"
PREORDERS_OPEN = "true"
SITE_URL = "https://www.hakoshop.com"
SITE_QUERY = "shop=test"
ALLOWED_ORIGINS = "https://www.hakoshop.com,https://hakoshop.com"
SHIPPING_CENTS = '{"US": 1500, "CA": 4500, "MX": 4500, "*": 6900}'

[[env.test.durable_objects.bindings]]
name = "FOUNDERS"
class_name = "Founders"
